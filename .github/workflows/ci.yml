name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.12.22
      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev
      - name: Install audio decoder on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Offline tests
        env:
          REQUIRE_AUDIO_CHECK: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: uv run --frozen --extra dev coverage run --source=wappler -m pytest --junitxml=test-results.xml
      - name: Coverage summary
        run: uv run --frozen --extra dev coverage report --fail-under=90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  postgres:
    name: PostgreSQL queue and quota contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: wappler-local-test
          POSTGRES_DB: wappler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wappler_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.12.22
      - run: uv sync --frozen --extra dev
      - name: Exercise real PostgreSQL transactions and concurrency
        env:
          TEST_DATABASE_URL: postgresql://postgres:wappler-local-test@127.0.0.1:5432/wappler_test
        run: uv run --frozen --extra dev pytest tests/unit/test_jobs.py -v

  quality:
    name: Code, package and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.12.22
      - run: uv sync --frozen --extra dev
      - name: Formatting and error checks
        run: |
          uv run --frozen --extra dev black src tests docs/conf.py --check
          uv run --frozen --extra dev isort src tests docs/conf.py --check-only
          uv run --frozen --extra dev flake8 src tests docs/conf.py --select=E9,F63,F7,F82
      - name: Build distribution
        run: uv run --frozen --extra dev python -m build
      - name: Build Sphinx
        run: uv run --frozen --extra dev sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-and-distributions
          path: |
            docs/_build/html
            dist

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.12.22
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pip-audit --skip-editable
