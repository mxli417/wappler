name: OpenAI transcription smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transcribe:
    # Only a manual run of the default branch can access the test environment.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: openai-live
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.12.22
      - run: uv sync --frozen --extra dev
      - name: Transcribe the M4A and OGG fixtures
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --frozen --extra dev pytest --live -m openai_live tests/integration/test_live.py -q --tb=short
