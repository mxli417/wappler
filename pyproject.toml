[build-system]
requires = [
    "setuptools>=84,<85",
]
build-backend = "setuptools.build_meta"

[project]
name = "wappler"
version = "0.0.1"
description = "Minimal WhatsApp voice-note transcription service using Twilio and OpenAI"
authors = [
  { name = "Mxli417", email = "mx.meidinger@gmail.com" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies = {dev = { file = ["requirements-dev.txt"] }}

[project.urls]
"Homepage" = "https://github.com/mxli417/wappler"
"Bug Tracker" = "https://github.com/mxli417/wappler/issues"
"Source" = "https://github.com/mxli417/wappler"
"Documentation" = "https://github.com/mxli417/wappler/tree/HEAD/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: explicitly enabled tests that call paid external APIs",
    "openai_live: live transcription only; never sends WhatsApp messages",
    "twilio_live: sends a real WhatsApp message",
    "audio_fixture: decodes recorded fixtures with FFmpeg",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "requirements.txt" }, { file = "requirements-dev.txt" }]
