[tox]
envlist = test, codestyle, build_docs
isolated_build = True

[testenv]
extras = dev

[testenv:test]
commands = coverage run --source=wappler -m pytest {posargs}

[testenv:codestyle]
commands =
    black src tests docs/conf.py --check --diff
    isort src tests docs/conf.py --check-only --diff
    flake8 src tests docs/conf.py --select=E9,F63,F7,F82

[testenv:cleanup]
commands =
    black src tests docs/conf.py
    isort src tests docs/conf.py

[testenv:build_docs]
commands = sphinx-build -W --keep-going -b html docs docs/_build/html {posargs}
